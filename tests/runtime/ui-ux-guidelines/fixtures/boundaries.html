<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control boundaries fixture</title>
<style>
  body { margin: 0; background: #ffffff; }
  .track { width: 200px; height: 48px; margin: 64px; background: #f2f2f2; }
  #outlined { border: 2px solid #8a8a8a; }
  #faint { border: 2px solid #e6e6e6; }
</style>
</head>
<body>
<main>
  <div id="outlined" class="track" role="switch" aria-checked="false" aria-label="Sync" tabindex="0"></div>
  <div id="faint" class="track" role="switch" aria-checked="false" aria-label="Share" tabindex="0"></div>
</main>
</body>
</html>
