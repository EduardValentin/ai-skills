<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Root after click</title></head>
<body>
<div id="app"><button type="button">Open</button></div>
<script>
  document.querySelector("button").addEventListener("click", () => {
    const section = document.createElement("section");
    section.setAttribute("data-parity-root", "Created");
    section.setAttribute("aria-label", "Created");
    section.innerHTML = "<h2>Created</h2><p>after click</p>";
    document.getElementById("app").appendChild(section);
  });
</script>
</body>
</html>
