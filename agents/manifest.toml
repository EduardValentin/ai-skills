version = 1

[[agent]]
id = "code-mapper"
source = "code-mapper.md"
description = "Read-only codebase mapper for implementation, review, or planning tasks that need precise file and symbol locators before decisions or edits."
groups = ["ticket-workflow", "code-mapper"]

[agent.codex]
model_reasoning_effort = "medium"
sandbox_mode = "read-only"

[agent.claude]
model = "sonnet"
effort = "medium"
permissionMode = "plan"
tools = ["Read", "Glob", "Grep", "Bash"]
color = "cyan"

[[agent]]
id = "acceptance-criteria-reviewer"
source = "acceptance-criteria-reviewer.md"
description = "Read-only reviewer that checks an implementation covers every acceptance criterion and approved-plan item faithfully, drops nothing silently, and builds nothing beyond the approved scope."
groups = ["ticket-workflow", "multi-ticket-workflow", "implementation-workflow"]

[agent.codex]
model_reasoning_effort = "high"
sandbox_mode = "read-only"

[agent.claude]
model = "sonnet"
effort = "high"
permissionMode = "plan"
tools = ["Read", "Glob", "Grep", "Bash"]
color = "blue"

[[agent]]
id = "architecture-reviewer"
source = "architecture-reviewer.md"
description = "Read-only reviewer of component boundaries, cohesion of things that change together, discoverable structure, and dependency direction from stable to volatile components."
groups = ["ticket-workflow", "multi-ticket-workflow", "implementation-workflow"]

